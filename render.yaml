# Render Blueprint for HaTi-Mapper.
# Deploy: on render.com choose "New +" → "Blueprint", connect this repo, and
# Render reads this file to create the web service. Then set the secrets
# in the dashboard — they are intentionally not stored here.
#
# This service sits alongside HaTi's own. See PERSISTENCE below on disks.
#
# PRIVACY: this dashboard describes how HaTi is built, including its endpoints
# that work without logging in, so it sits behind its own email-and-password
# login. Set MAPPER_OWNER_EMAIL before the first visit so only you can claim
# the account.
#
# PERSISTENCE: the account, the AI key and the change log are written under
# MAPPER_DATA, and the disk below is what keeps them. Without it they live in
# the service's own directory, which Render replaces on every deploy — so each
# deploy silently returned the Mapper to a first-ever scan, with nothing to
# compare the next one against and therefore nothing in the change log. An
# archive that resets whenever you ship cannot answer "has this been growing
# for a month", which is most of what it is for.
services:
  - type: web
    name: hati-mapper
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    # Small on purpose: the whole state is a handful of JSON files, and the
    # archive is capped in code rather than by the disk running out.
    disk:
      name: mapper-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Must match the mount path above. Together these are the difference
      # between a change log that accumulates and one that starts again every
      # time you deploy.
      - key: MAPPER_DATA
        value: /var/data
      - key: NODE_VERSION
        value: "22"
      - key: HATI_REPO
        value: youngmbg21-cmyk/mkataba-clm
      - key: HATI_REF
        value: main
      # Fine-grained PAT, read-only Contents on the HaTi repo and nothing else.
      - key: GITHUB_TOKEN
        sync: false   # set this in the Render dashboard; never committed to git
      # Base URL of the running HaTi, e.g. https://hati-clm.onrender.com
      - key: HATI_URL
        sync: false
      # Must match MAPPER_TOKEN on the HaTi service. Clearing it there turns
      # HaTi's /api/pulse off entirely.
      - key: MAPPER_TOKEN
        sync: false
      # The only email allowed to claim the account. Set this before the
      # first visit, so nobody else can claim the Mapper.
      - key: MAPPER_OWNER_EMAIL
        sync: false
      # Needed to email password-reset links. Without it the link is written
      # to this service's log instead, which still works but is less private.
      - key: RESEND_API_KEY
        sync: false
      # OPTIONAL fallback only — the assistant's key is normally set inside
      # the platform, on the Settings tab, where it lives behind the login.
      - key: ANTHROPIC_API_KEY
        sync: false
